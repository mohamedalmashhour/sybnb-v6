<style>
:root{--ink:#17372c;--muted:#63776d;--green:#215b44;--lime:#e7f2c6;--paper:#f7f8f2;--line:#dce3d9}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button,a,input,select{outline-offset:4px}button{cursor:pointer}a{color:var(--green)}.demo{background:#e9eddf;text-align:center;padding:10px 18px;font-size:12px;font-weight:650}.shell{max-width:1220px;margin:auto;padding:24px 36px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:25px}.brand{font-size:26px;font-weight:850;letter-spacing:-1px}.brand span{font-size:12px;letter-spacing:2px;margin-left:12px;font-weight:500}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button,.lang{padding:10px 15px;border:0;background:transparent;border-radius:30px;color:var(--muted)}.nav button.active{background:var(--green);color:white}.lang{border:1px solid var(--line)}.eyebrow{text-transform:uppercase;font-size:11px;letter-spacing:2px;font-weight:750;color:var(--muted)}h1{font-size:48px;letter-spacing:-2px;line-height:1.08;margin:14px 0 18px}h2{font-size:23px;letter-spacing:-.6px}p{line-height:1.7;color:var(--muted)}.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:32px}.card{background:white;border:1px solid var(--line);border-radius:24px;padding:26px}.hero{padding:35px 0}.pill{display:inline-block;background:var(--lime);padding:7px 12px;border-radius:20px;font-size:12px;font-weight:700}.form{display:grid;gap:15px;margin-top:24px}label{font-size:12px;font-weight:700;display:grid;gap:7px}input,select{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;background:#fbfcf9;color:var(--ink)}.row{display:flex;gap:12px;align-items:center}.row>*{flex:1}.primary{border:0;background:var(--green);color:white;padding:15px 20px;border-radius:12px;font-weight:700}.secondary{border:1px solid var(--line);background:white;border-radius:12px;padding:13px}.small{font-size:12px;color:var(--muted)}.map{background:#e8eee3;height:325px;border-radius:18px;overflow:hidden;position:relative}.map svg{width:100%;height:100%}.mapLabel{position:absolute;left:20px;bottom:18px;background:white;border-radius:10px;padding:11px;font-size:12px;box-shadow:0 3px 18px #0001}.quote{padding-top:20px}.fare{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:14px 0}.price{font-size:23px;font-weight:750}.avatar{width:42px;height:42px;display:grid;place-items:center;background:var(--lime);border-radius:50%;flex:none}.details{display:flex;gap:14px;align-items:center;margin-top:18px}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:25px}.tile{background:white;border:1px solid var(--line);padding:22px;border-radius:18px}.tile h3{margin:0 0 9px;font-size:16px}.tile p{font-size:13px;margin:0}.footer{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:35px;padding-top:20px;gap:20px;font-size:12px;color:var(--muted)}.building{height:210px;background:#e4e5d9;border-radius:18px;overflow:hidden}.building svg{width:100%;height:100%}.walletAmount{font-size:44px;font-weight:780;letter-spacing:-2px;margin:16px 0}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:15px 8px;border-bottom:1px solid var(--line);font-size:13px}.status{font-size:11px;border-radius:18px;background:var(--lime);padding:5px 9px}.notice{background:#f4efd9;border-radius:12px;padding:14px;font-size:12px;line-height:1.7;margin-top:20px}.draft{white-space:pre-wrap;font-family:inherit;line-height:1.7;background:#f4f6ef;padding:18px;border-radius:12px}dialog{border:1px solid var(--line);border-radius:22px;max-width:460px;padding:30px;color:var(--ink)}dialog::backdrop{background:#17372c66}.close{float:right;background:none;border:0;font-size:22px}.metric{font-size:30px;font-weight:750;display:block;margin-bottom:8px}.sectionhead{max-width:680px;margin:22px 0 30px}#result{margin-top:18px}.tabs{display:flex;gap:12px;margin-top:12px}.tabs button{border:1px solid var(--line);background:white;border-radius:20px;padding:9px 16px}.tabs button.active{background:var(--lime)}@media(max-width:760px){.shell{padding:20px}header{flex-wrap:wrap}.nav{order:3;width:100%;gap:1px}.nav button{padding:10px 11px;font-size:13px}.brand{font-size:23px}.grid{grid-template-columns:1fr;gap:20px}h1{font-size:36px}.hero{padding:15px 0}.tiles{grid-template-columns:1fr}.map{height:230px}.card{padding:20px}.footer{display:block}.row{flex-wrap:wrap}.row>*{min-width:110px}.table{display:block;overflow-x:auto}.walletAmount{font-size:36px}}
</style></head>
<body>
<div class="demo" id="banner"></div>
<div class="shell"><header><div class="brand">QRide<span>QUÉBEC</span></div><nav class="nav" aria-label="Sections" id="nav"></nav><button class="lang" id="language">EN</button></header><main id="main"></main><footer class="footer"><span id="foot1"></span><span id="foot2"></span></footer></div>
<dialog id="modal"><button class="close" aria-label="Close" id="close">×</button><h2 id="modalTitle"></h2><p id="modalText"></p><div id="authPanel"></div><button class="primary" id="modalDone">OK</button></dialog>
<script>
'use strict';
let lang='fr',page='ride',provider='driver';const demoSessions={customer:false,driver:false,host:false,admin:false};let pendingAuth=null;let trips=[];let activeTrip=null;let historyRole='rider';let historyTripId='';const $=id=>document.getElementById(id);const t=(fr,en)=>lang==='fr'?fr:en;
function mapView(){return `<div id="qrideGoogleMap"><p class="small">${t('Carte Google intégrée : configuration requise. La saisie manuelle reste disponible.','In-app Google map: configuration required. Manual entry remains available.')}</p></div>`}
function tile(title,body){return `<article class="tile"><h3>${title}</h3><p>${body}</p></article>`}
function show(title,text){pendingAuth=null;$('authPanel').replaceChildren();$('modalDone').textContent='OK';$('modalTitle').textContent=title;$('modalText').textContent=text;$('modal').showModal()}
function render(){document.documentElement.lang=lang;$('banner').textContent=t('PROTOTYPE INTERACTIF · Données fictives · Aucun paiement, réservation ou service réel','INTERACTIVE PROTOTYPE · Sample data · No real payments, bookings or service');$('language').textContent=lang==='fr'?'EN':'FR';$('foot1').textContent=t('Québec d’abord. Syrie dans une version distincte, après validation.','Quebec first. Syria in a separate version after review.');$('foot2').textContent=t('Prévisualisation locale · Aucune donnée sauvegardée · Google Maps sur demande','Local preview · No saved data · Google Maps opens only on request');const nav=[['ride','Courses','Rides'],['history','Historique','Trip history'],['wallet','Portefeuille','Wallet'],['provider','Chauffeurs','Drivers'],['admin','Administration','Admin']];$('nav').innerHTML=nav.map(([key,fr,en])=>`<button data-page="${key}" class="${page===key?'active':''}" ${page===key?'aria-current="page"':''}>${t(fr,en)}</button>`).join('');$('nav').insertAdjacentHTML('beforeend',`<button id="resetDemo">${t('Réinitialiser','Reset demo')}</button>`);$('resetDemo').onclick=()=>{for(const role of Object.keys(demoSessions))demoSessions[role]=false;pendingAuth=null;trips=[];activeTrip=null;historyTripId='';if($('modal').open)$('modal').close();render()};document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});if(page==='ride')ride();if(page==='history')tripHistory();if(page==='wallet')wallet();if(page==='provider')providers();if(page==='admin')admin();if((page==='provider'&&demoSessions[provider])||(page==='admin'&&demoSessions.admin)){const out=document.createElement('button');out.className='secondary';out.id='accountSignout';out.textContent=t('Se déconnecter','Sign out');out.onclick=()=>{demoSessions[page==='admin'?'admin':provider]=false;render()};$('main').prepend(out)}window.dispatchEvent(new CustomEvent('qride:render'))}
function ride(){$('main').innerHTML=`<div class="grid hero"><section><span class="eyebrow">QRIDE · QUÉBEC</span><h1>${t('Votre ville.<br>Votre prochaine course.','Your city.<br>Your next ride.')}</h1><p>${t('Un trajet clair, du départ à l’arrivée. Voyez le prix et les détails avant de confirmer.','A clear journey from pickup to arrival. Review the price and details before confirming.')}</p><span class="pill">${t('Scénario fictif à Montréal','Sample Montreal scenario')}</span><form class="form" id="rideForm"><label>${t('Départ','Pickup')}<input id="pickup" value="Plateau-Mont-Royal" required maxlength="120"></label><div class="row"><button class="secondary" type="button" id="myLocation">${t("Utiliser ma position","Use my location")}</button><button class="secondary" type="button" id="googlePickup">Google Maps ↗</button></div><div id="locationStatus" class="small" role="status"></div><label>${t('Destination','Destination')}<input id="dropoff" value="Gare Centrale" required maxlength="120"></label><div class="row"><label>${t('Quand','When')}<select id="rideWhen"><option value="now">${t('Maintenant','Now')}</option><option value="schedule">${t('Planifier','Schedule')}</option></select></label><label>${t('Passagers','Passengers')}<select id="passengers"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option></select></label></div><fieldset id="schedulePanel" hidden style="border:1px solid var(--line);border-radius:12px;padding:16px"><legend>${t("Date et heure de départ","Pickup date and time")}</legend><div class="row"><label>${t("Date","Date")}<input id="scheduleDate" type="date"></label><label>${t("Heure","Time")}<input id="scheduleTime" type="time" step="60"></label></div><p class="small">${t("Scénario Montréal · heure locale America/Toronto. Aucune disponibilité garantie.","Montreal scenario · local America/Toronto time. No guaranteed availability.")}</p></fieldset><label>${t("Catégorie de voiture","Car category")}<select id="carCategory"><option value="standard">Standard · 1–4</option><option value="comfort">Comfort · 1–4</option><option value="xl">XL · 1–6</option><option value="van">Van · 1–7</option><option value="taxi">Taxi · Québec · 1–4</option></select></label><div class="row"><label>${t("Distance fictive (km)","Sample distance (km)")}<input id="tripKm" type="number" min="1" max="100" step="0.5" value="6"></label><label>${t("Durée fictive (min)","Sample duration (min)")}<input id="tripMinutes" type="number" min="1" max="240" step="1" value="18"></label></div><label>${t("Demande simulée — pas en direct","Simulated demand — not live")}<select id="demand"><option value="1">${t("Normale · ×1.00","Normal · ×1.00")}</option><option value="1.25">${t("Élevée · ×1.25","Busy · ×1.25")}</option><option value="1.5">${t("Très élevée · ×1.50","Very busy · ×1.50")}</option><option value="2">${t("Plafond démo · ×2.00","Demo cap · ×2.00")}</option></select></label><button class="primary">${t('Voir la course de démonstration','View sample ride')}</button></form></section><section class="card">${mapView()}<div class="quote"><div class="fare"><div><b id="categoryName">Standard</b><div class="small">${t('Estimation fictive · aucune voiture réelle','Sample estimate · no real car')}</div></div><div class="price" id="ridePrice">—</div></div><div id="fareBreakdown" class="small" aria-live="polite" style="padding-top:14px"></div><div id="categoryStatus" class="notice" role="status"></div><div id="driverMatch" style="margin-top:18px"></div><p class="small">${t('Le montant est une illustration, pas un tarif vérifié ni un calcul fiscal.','The amount is illustrative, not a verified fare or tax calculation.')}</p></div></section></div><section class="tiles">${tile(t('Prix avant confirmation','Price before confirmation'),t('Le total, les frais et les règles d’annulation sur le même écran.','Total, fees and cancellation terms on the same screen.'))}${tile(t('Des trajets vérifiables','Verifiable trips'),t('Identité du chauffeur, véhicule et partage du trajet dans la version à construire.','Driver identity, vehicle and trip sharing in the planned version.'))}${tile(t('Le Québec, localement','Quebec, locally'),t('Une zone devient disponible après validation et présence de prestataires.','A service area becomes available after review and provider availability.'))}</section>`;setupPickup();setupPricing();setupSchedule();renderDriverMatch();$('rideForm').onsubmit=e=>{e.preventDefault();if(!updatePricing()||!validSchedule())return;if(activeTrip&&activeTrip.state!=='COMPLETED'){show(t('Course déjà en cours','Ride already active'),t('Terminez la simulation en cours avant une nouvelle demande.','Complete the current simulation before requesting another.'));return}const request=captureRideRequest();if(!demoSessions.customer){requestAccount('customer',()=>{matchDemoDriver(request);show(t('Chauffeur fictif trouvé','Sample driver found'),t('Vérifiez le nom, le véhicule et la plaque avant de monter. Aucun chauffeur réel contacté.','Check the name, vehicle and plate before boarding. No real driver was contacted.')+(request.scheduledAt?' '+request.scheduledAt:''))});return;}matchDemoDriver(request);show(t('Chauffeur fictif trouvé','Sample driver found'),t('Vérifiez la voiture et la plaque avant de monter.','Check the car and plate before boarding.')+(request.scheduledAt?' '+request.scheduledAt:''))}}

function escapeTripText(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function captureRideRequest(){const category=$('carCategory').value;const quote=sampleQuote(category,Number($('tripKm').value),Number($('tripMinutes').value),Number($('demand').value),Number($('passengers').value));return {pickup:$('pickup').value,dropoff:$('dropoff').value,category,passengers:Number($('passengers').value),quoteCents:quote?.total??null,currency:'CAD',scheduledAt:$('rideWhen').value==='schedule'?$('scheduleDate').value+' '+$('scheduleTime').value+' America/Toronto':null}}
function tripEvent(trip,type,detail){trip.events.push(Object.freeze({sequence:trip.events.length+1,type,timestamp:new Date().toISOString(),detail,simulated:true}))}
function matchDemoDriver(request){
 const cars={standard:['Toyota','Corolla'],comfort:['Toyota','Camry'],xl:['Toyota','Highlander'],van:['Toyota','Sienna'],taxi:['Toyota','Prius']};const car=cars[request.category]||cars.standard;
 const trip={id:'QR-DEMO-'+String(trips.length+1).padStart(4,'0'),state:'MATCHED',...request,driver:Object.freeze({id:'DEMO-DRIVER-01',name:'Alex Martin · DEMO',make:car[0],model:car[1],year:2023,colour:'Gris / Grey',plate:'DEMO-QC-001'}),events:[],startedAt:null,endedAt:null,mediaRecording:false};
 tripEvent(trip,'REQUESTED','Sample rider request');tripEvent(trip,'DRIVER_MATCHED','Sample driver/vehicle assigned; no real dispatch');trips.push(trip);activeTrip=trip;historyTripId=trip.id;renderDriverMatch();
}
function renderDriverMatch(){const el=$('driverMatch');if(!el)return;if(!activeTrip){el.innerHTML=`<p class="small">${t('Le nom du chauffeur, la voiture et la plaque apparaîtront après une correspondance fictive.','Driver name, car and plate will appear after a sample match.')}</p>`;return}
 const trip=activeTrip,d=trip.driver;
 el.innerHTML=`<div class="pill">${t('Chauffeur trouvé · DÉMO','Driver found · DEMO')}</div><h2>${escapeTripText(d.name)}</h2><p>${escapeTripText(d.make+' '+d.model+' '+d.year+' · '+d.colour)}</p><div class="fare"><span>${t('Plaque fictive','Sample plate')}</span><strong>${escapeTripText(d.plate)}</strong></div><p class="small">${escapeTripText(trip.id)} · ${escapeTripText(trip.state)}</p><p class="small">${t('Comparez ces détails avec la voiture avant de monter. Le journal de trajet est simulé; aucun micro/caméra ni suivi GPS continu.','Match these details to the car before boarding. Trip history is simulated; no microphone/camera or continuous GPS tracking.')}</p><div class="form">${trip.state==='MATCHED'?`<button class="primary" id="startTrip">${t('Simuler l’embarquement et le départ','Simulate boarding and start')}</button>`:''}${trip.state==='IN_PROGRESS'?`<button class="secondary" id="routeEvent">${t('Ajouter un point de trajet fictif','Add a sample route point')}</button><button class="primary" id="endTrip">${t('Terminer la course fictive','Complete sample ride')}</button>`:''}<button class="secondary" id="viewTrip">${t('Consulter le dossier du trajet','View trip record')}</button></div>`;
 if($('startTrip'))$('startTrip').onclick=()=>{if(trip.state!=='MATCHED')return;trip.state='IN_PROGRESS';trip.startedAt=new Date().toISOString();tripEvent(trip,'BOARDED','Boarding simulated; compare driver/car/plate');tripEvent(trip,'TRIP_STARTED','Trip-event log started; audio/video off');renderDriverMatch()};
 if($('routeEvent'))$('routeEvent').onclick=()=>{if(trip.state!=='IN_PROGRESS')return;tripEvent(trip,'ROUTE_SAMPLE','Illustrative Montreal route point; not device GPS or driving-quality assessment');renderDriverMatch()};
 if($('endTrip'))$('endTrip').onclick=()=>{if(trip.state!=='IN_PROGRESS')return;trip.state='COMPLETED';trip.endedAt=new Date().toISOString();tripEvent(trip,'TRIP_COMPLETED','Sample ride ended; no charge');renderDriverMatch()};
 $('viewTrip').onclick=()=>{page='history';render()};
}
function tripHistory(){const trip=trips.find(x=>x.id===historyTripId)||activeTrip||trips[trips.length-1];$('main').innerHTML=`<div class="sectionhead"><span class="eyebrow">${t('DOSSIER DE SÉCURITÉ · DÉMONSTRATION','SAFETY RECORD · DEMONSTRATION')}</span><h1>${t('Historique du trajet','Trip history')}</h1><p>${t('Vues d’exemple pour passager, chauffeur et équipe autorisée de la plateforme. Ce sélecteur démontre le futur parcours, pas un contrôle d’accès réel.','Sample rider, driver and authorized platform views. This selector demonstrates a future flow, not real access control.')}</p></div><section class="card"><label>${t("Trajet","Trip")}<select id="historyTrip">${trips.slice().reverse().map(x=>`<option value="${escapeTripText(x.id)}">${escapeTripText(x.id)}</option>`).join('')}</select></label><label>${t('Vue de démonstration','Demonstration view')}<select id="historyRole"><option value="rider">${t('Passager','Rider')}</option><option value="driver">${t('Chauffeur','Driver')}</option><option value="platform">${t('Plateforme — sécurité','Platform — safety')}</option></select></label><div id="historyContent"></div></section>`;$('historyTrip').value=trip?.id||'';$('historyTrip').onchange=()=>{historyTripId=$('historyTrip').value;tripHistory()};$('historyRole').value=historyRole;$('historyRole').onchange=()=>{historyRole=$('historyRole').value;renderTripHistoryContent(trip)};renderTripHistoryContent(trip)}
function renderTripHistoryContent(trip){const el=$('historyContent');if(!trip){el.innerHTML=`<p>${t('Aucun trajet fictif pour le moment. Faites une demande dans Courses.','No sample trips yet. Request one in Rides.')}</p>`;return}
 const d=trip.driver;el.innerHTML=`<h2>${escapeTripText(trip.id)}</h2><p>${escapeTripText(d.name+' · '+d.make+' '+d.model+' · '+d.plate)}</p><div class="fare"><span>${t('Départ / arrivée','Pickup / destination')}</span><span>${escapeTripText(trip.pickup)} → ${escapeTripText(trip.dropoff)}</span></div><div class="fare"><span>${t('Catégorie / état','Category / status')}</span><span>${escapeTripText(trip.category+' / '+trip.state)}</span></div><div class="fare"><span>${t('Prix de démonstration','Sample price')}</span><span>${trip.quoteCents==null?t('Tarif à vérifier','Fare to verify'):cad(trip.quoteCents)}</span></div><p class="small">${t('Aucun enregistrement audio/vidéo. Les points de trajet sont fictifs. Rechargement/Réinitialiser efface cette démo.','No audio/video recording. Route points are simulated. Reload/Reset clears this demo.')}</p><table class="table"><thead><tr><th>#</th><th>${t('Événement','Event')}</th><th>${t('Heure UTC','UTC time')}</th></tr></thead><tbody>${trip.events.map(event=>`<tr><td>${event.sequence}</td><td>${escapeTripText(event.type)}<div class="small">${escapeTripText(event.detail)}</div></td><td>${escapeTripText(event.timestamp)}</td></tr>`).join('')}</tbody></table><div class="row" style="margin-top:18px"><button class="secondary" id="reportTrip">${t('Signaler un problème fictif','Report sample issue')}</button><button class="secondary" id="exportTrip">${t('Télécharger le dossier fictif','Download sample record')}</button></div><p id="historyNotice" class="small" role="status"></p>`;
 $('reportTrip').onclick=()=>{tripEvent(trip,'SAFETY_REVIEW_REQUESTED','Sample '+historyRole+' review request; not sent to a real safety team');renderTripHistoryContent(trip);$('historyNotice').textContent=t('Demande fictive ajoutée au journal. Aucune alerte réelle envoyée.','Sample request added. No real alert sent.')};
 $('exportTrip').onclick=()=>{const payload={schemaVersion:1,prototype:true,viewer:historyRole,trip};const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=trip.id+'-sample.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('historyNotice').textContent=t('Export de démonstration demandé.','Sample export requested.')};
}
function localMontrealNow(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Toronto',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());const v=Object.fromEntries(parts.map(p=>[p.type,p.value]));return v.year+'-'+v.month+'-'+v.day+'T'+v.hour+':'+v.minute}
function setupSchedule(){
 const panel=$('schedulePanel'),date=$('scheduleDate'),time=$('scheduleTime');date.min=localMontrealNow().slice(0,10);
 $('rideWhen').onchange=()=>{const scheduled=$('rideWhen').value==='schedule';panel.hidden=!scheduled;date.required=scheduled;time.required=scheduled;date.setCustomValidity('');time.setCustomValidity('');if(scheduled)date.focus()};
 date.oninput=()=>date.setCustomValidity('');time.oninput=()=>time.setCustomValidity('');
}
function validSchedule(){if($('rideWhen').value!=='schedule')return true;const date=$('scheduleDate'),time=$('scheduleTime');if(!date.value||!time.value||date.value+'T'+time.value<=localMontrealNow()){time.setCustomValidity(t('Choisissez une date et une heure futures.','Choose a future date and time.'));time.reportValidity();return false}time.setCustomValidity('');return true}
function scheduleSummary(){return $('rideWhen')?.value==='schedule'?' '+t('Départ choisi : ','Selected pickup: ')+$('scheduleDate').value+' '+$('scheduleTime').value+' · America/Toronto':''}
function requestGuest(after){
 show(t('Continuer sans compte','Continue as a guest'),t('Démonstration uniquement : code courriel fictif, aucun message envoyé. Sans inscription ni mot de passe.','Demo only: sample email code, no message sent. No signup or password.'));
 $('authPanel').innerHTML=`<div class="form"><label>${t('Courriel fictif','Sample email')}<input readonly type="email" value="guest@example.invalid"></label><label>${t('Code courriel fictif','Sample email code')}<input readonly inputmode="numeric" value="000000"></label></div>`;
 $('modalDone').textContent=t('Simuler la vérification du courriel','Simulate email verification');
 pendingAuth={role:'customer',after};
}
function requestAccount(role,after){
 if(role==='customer'){requestGuest(after);return;}

 show(t('Créer un compte ou se connecter','Create account or sign in'),t('Prototype uniquement. N’entrez aucun identifiant réel. Le service réel exigera une session vérifiée.','Prototype only. Do not enter real credentials. The live service will require a verified session.'));
 pendingAuth={role,after};
 pendingAuth.capsule=window.renderAccountCapsule({container:$('authPanel'),role,language:lang,action:$('modalDone')});
}

const demoCars={standard:{name:'Standard',capacity:4,base:400,km:160,minute:35,minimum:1000},comfort:{name:'Comfort',capacity:4,base:550,km:190,minute:40,minimum:1300},xl:{name:'XL',capacity:6,base:600,km:220,minute:45,minimum:1600},van:{name:'Van',capacity:7,base:800,km:260,minute:55,minimum:2000},taxi:{name:'Taxi · Québec',capacity:4,taxi:true},yellowTaxi:{name:'Taxi jaune · Syrie',capacity:4,taxi:true,syria:true}};
function sampleQuote(category,km,minutes,demand,riders){
 const c=demoCars[category];if(c?.taxi)return null;
 if(!c||![km,minutes,demand,riders].every(Number.isFinite)||km<1||km>100||minutes<1||minutes>240||!Number.isInteger(minutes)||!Number.isInteger(riders)||riders<1||riders>c.capacity||demand<1||demand>2)return null;
 const distance=Math.round(km*c.km),duration=minutes*c.minute;
 const subtotal=Math.max(c.minimum,c.base+distance+duration);
 const total=Math.round(subtotal*demand);
 return {name:c.name,base:c.base,distance,duration,minimum:c.minimum,subtotal,demand,surcharge:total-subtotal,total};
}
function cad(cents){return new Intl.NumberFormat(lang==='fr'?'fr-CA':'en-CA',{style:'currency',currency:'CAD'}).format(cents/100)}
function updatePricing(){
 const c=$('carCategory').value;
 const type=demoCars[c];if(type?.taxi){const passengers=Number($('passengers').value);$('categoryName').textContent=type.syria?t('Taxi jaune · Syrie','Yellow taxi · Syria'):type.name;$('ridePrice').textContent=t('Tarif à vérifier','Fare to verify');$('fareBreakdown').textContent=t('Aucun multiplicateur de demande appliqué aux taxis dans ce prototype.','No demand multiplier applied to taxis in this prototype.');$('categoryStatus').textContent=passengers>type.capacity?t('Cette catégorie accepte au maximum 4 passagers.','This category supports at most 4 passengers.'):type.syria?t('Taxi jaune : concept pour la Syrie uniquement. Aucune disponibilité au Québec ni tarif syrien vérifié.','Yellow taxi: Syria concept only. No Quebec availability or verified Syrian fare.'):t('Taxi québécois : qualification et tarification applicables à valider avant une course réelle.','Quebec taxi: qualification and applicable pricing must be reviewed before a real ride.');return passengers>=1&&passengers<=type.capacity}const q=sampleQuote(c,Number($('tripKm').value),Number($('tripMinutes').value),Number($('demand').value),Number($('passengers').value));
 $('categoryName').textContent=demoCars[c]?.name||'—';
 if(!q){$('ridePrice').textContent='—';$('fareBreakdown').textContent='';$('categoryStatus').textContent=t('Vérifiez la distance, la durée et la capacité de la catégorie. Aucune course confirmée.','Check distance, duration and category capacity. No ride confirmed.');return false}
 $('ridePrice').textContent=cad(q.total);
 $('fareBreakdown').textContent=t('Départ : ','Base: ')+cad(q.base)+t(' · distance : ',' · distance: ')+cad(q.distance)+t(' · durée : ',' · time: ')+cad(q.duration)+t(' · minimum : ',' · minimum: ')+cad(q.minimum)+t(' · ajustement demande : ',' · demand adjustment: ')+cad(q.surcharge)+' (×'+q.demand.toFixed(2)+')';
 $('categoryStatus').textContent=t('Tarifs inventés pour cette démo, avant taxes/frais réglementaires. Aucun calcul de trafic Google. Le prix d’une course réelle devra être confirmé et verrouillé avant réservation.','Invented demo rates, before taxes/regulatory fees. No Google traffic calculation. A real ride price must be confirmed and locked before booking.');
 return true;
}
function setupPricing(){for(const id of ['carCategory','tripKm','tripMinutes','demand','passengers'])$(id).addEventListener('input',()=>{updatePricing();if(id==='carCategory'){$('categoryName').textContent=$('carCategory').value==='yellowTaxi'?t('Taxi jaune · Syrie','Yellow taxi · Syria'):demoCars[$('carCategory').value].name}});updatePricing()}
function setupPickup(){
 const button=$('myLocation'),status=$('locationStatus'),pickup=$('pickup');
 $('googlePickup').onclick=()=>{
  const value=pickup.value.trim();
  if(!value){status.textContent=t('Entrez un lieu de départ ou utilisez votre position.','Enter a pickup or use your location.');return}
  window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(value),'_blank','noopener,noreferrer');
 };
 button.onclick=()=>{
  if(!navigator.geolocation){status.textContent=t('La localisation n’est pas disponible. Entrez votre départ manuellement.','Location is unavailable. Enter pickup manually.');return}
  button.disabled=true;status.textContent=t('Recherche de votre position…','Finding your location…');
  navigator.geolocation.getCurrentPosition(position=>{
   if(!$('pickup')||$('pickup')!==pickup)return;
   const lat=position.coords.latitude,lng=position.coords.longitude;
   button.disabled=false;
   if(!Number.isFinite(lat)||!Number.isFinite(lng)||Math.abs(lat)>90||Math.abs(lng)>180){status.textContent=t('Position invalide. Entrez votre départ manuellement.','Invalid location. Enter pickup manually.');return}
   pickup.value=lat.toFixed(6)+', '+lng.toFixed(6);window.dispatchEvent(new CustomEvent('qride:location',{detail:{lat,lng}}));
   status.textContent=t('Coordonnées renseignées. Chargez la carte intégrée pour vérifier le côté de la rue. Aucune course réelle.','Coordinates filled. Load the in-app map to check the pickup and street side. No real ride.');
  },error=>{
   if(!$('pickup')||$('pickup')!==pickup)return;
   button.disabled=false;
   status.textContent=error.code===1?t('Permission refusée. Entrez votre départ ou ouvrez Google Maps.','Permission denied. Enter pickup or open Google Maps.'):t('Position indisponible ou délai dépassé. Entrez votre départ manuellement.','Location unavailable or timed out. Enter pickup manually.');
  },{enableHighAccuracy:true,timeout:15000,maximumAge:30000});
 };
}
