<head>

<style>
:root{--ink:#17372c;--muted:#63776d;--green:#215b44;--lime:#e7f2c6;--paper:#f7f8f2;--line:#dce3d9}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button,a,input,select{outline-offset:4px}button{cursor:pointer}a{color:var(--green)}.demo{background:#e9eddf;text-align:center;padding:10px 18px;font-size:12px;font-weight:650}.shell{max-width:1220px;margin:auto;padding:24px 36px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:25px}.brand{font-size:26px;font-weight:850;letter-spacing:-1px}.brand span{font-size:12px;letter-spacing:2px;margin-left:12px;font-weight:500}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button,.lang{padding:10px 15px;border:0;background:transparent;border-radius:30px;color:var(--muted)}.nav button.active{background:var(--green);color:white}.lang{border:1px solid var(--line)}.eyebrow{text-transform:uppercase;font-size:11px;letter-spacing:2px;font-weight:750;color:var(--muted)}h1{font-size:48px;letter-spacing:-2px;line-height:1.08;margin:14px 0 18px}h2{font-size:23px;letter-spacing:-.6px}p{line-height:1.7;color:var(--muted)}.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:32px}.card{background:white;border:1px solid var(--line);border-radius:24px;padding:26px}.hero{padding:35px 0}.pill{display:inline-block;background:var(--lime);padding:7px 12px;border-radius:20px;font-size:12px;font-weight:700}.form{display:grid;gap:15px;margin-top:24px}label{font-size:12px;font-weight:700;display:grid;gap:7px}input,select{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;background:#fbfcf9;color:var(--ink)}.row{display:flex;gap:12px;align-items:center}.row>*{flex:1}.primary{border:0;background:var(--green);color:white;padding:15px 20px;border-radius:12px;font-weight:700}.secondary{border:1px solid var(--line);background:white;border-radius:12px;padding:13px}.small{font-size:12px;color:var(--muted)}.map{background:#e8eee3;height:325px;border-radius:18px;overflow:hidden;position:relative}.map svg{width:100%;height:100%}.mapLabel{position:absolute;left:20px;bottom:18px;background:white;border-radius:10px;padding:11px;font-size:12px;box-shadow:0 3px 18px #0001}.quote{padding-top:20px}.fare{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:14px 0}.price{font-size:23px;font-weight:750}.avatar{width:42px;height:42px;display:grid;place-items:center;background:var(--lime);border-radius:50%;flex:none}.details{display:flex;gap:14px;align-items:center;margin-top:18px}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:25px}.tile{background:white;border:1px solid var(--line);padding:22px;border-radius:18px}.tile h3{margin:0 0 9px;font-size:16px}.tile p{font-size:13px;margin:0}.footer{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:35px;padding-top:20px;gap:20px;font-size:12px;color:var(--muted)}.building{height:210px;background:#e4e5d9;border-radius:18px;overflow:hidden}.building svg{width:100%;height:100%}.walletAmount{font-size:44px;font-weight:780;letter-spacing:-2px;margin:16px 0}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:15px 8px;border-bottom:1px solid var(--line);font-size:13px}.status{font-size:11px;border-radius:18px;background:var(--lime);padding:5px 9px}.notice{background:#f4efd9;border-radius:12px;padding:14px;font-size:12px;line-height:1.7;margin-top:20px}.draft{white-space:pre-wrap;font-family:inherit;line-height:1.7;background:#f4f6ef;padding:18px;border-radius:12px}dialog{border:1px solid var(--line);border-radius:22px;max-width:460px;padding:30px;color:var(--ink)}dialog::backdrop{background:#17372c66}.close{float:right;background:none;border:0;font-size:22px}.metric{font-size:30px;font-weight:750;display:block;margin-bottom:8px}.sectionhead{max-width:680px;margin:22px 0 30px}#result{margin-top:18px}.tabs{display:flex;gap:12px;margin-top:12px}.tabs button{border:1px solid var(--line);background:white;border-radius:20px;padding:9px 16px}.tabs button.active{background:var(--lime)}@media(max-width:760px){.shell{padding:20px}header{flex-wrap:wrap}.nav{order:3;width:100%;gap:1px}.nav button{padding:10px 11px;font-size:13px}.brand{font-size:23px}.grid{grid-template-columns:1fr;gap:20px}h1{font-size:36px}.hero{padding:15px 0}.tiles{grid-template-columns:1fr}.map{height:230px}.card{padding:20px}.footer{display:block}.row{flex-wrap:wrap}.row>*{min-width:110px}.table{display:block;overflow-x:auto}.walletAmount{font-size:36px}}
</style></head>
<body>
<div class="demo" id="banner"></div>
<div class="shell"><header><div class="brand">QTR<span>QUÉBEC</span></div><nav class="nav" aria-label="Sections" id="nav"></nav><button class="lang" id="language">EN</button></header><main id="main"></main><footer class="footer"><span id="foot1"></span><span id="foot2"></span></footer></div>
<dialog id="modal"><button class="close" aria-label="Close" id="close">×</button><h2 id="modalTitle"></h2><p id="modalText"></p><div id="authPanel"></div><button class="primary" id="modalDone">OK</button></dialog>
<script>
'use strict';
let lang='fr',page='stay',provider='host';const demoSessions={customer:false,driver:false,host:false,admin:false};let pendingAuth=null;const $=id=>document.getElementById(id);const t=(fr,en)=>lang==='fr'?fr:en;
const building=`<div class="building"><svg viewBox="0 0 500 210" role="img" aria-label="Illustrative apartment"><rect width="500" height="210" fill="#e4e7da"/><rect x="75" y="35" width="270" height="200" fill="#c89f7e"/><rect x="93" y="52" width="233" height="8" fill="#e1c4a6"/><g fill="#f4f4dc" stroke="#314e42" stroke-width="5"><rect x="108" y="78" width="55" height="55"/><rect x="189" y="78" width="55" height="55"/><rect x="267" y="78" width="40" height="55"/><rect x="110" y="158" width="53" height="70"/><rect x="192" y="158" width="53" height="70"/></g><path d="M320 210L395 160L395 98" fill="none" stroke="#294b3b" stroke-width="5"/><circle cx="424" cy="76" r="45" fill="#b1c89d"/><rect x="420" y="99" width="8" height="120" fill="#506743"/></svg></div>`;
function tile(title,body){return `<article class="tile"><h3>${title}</h3><p>${body}</p></article>`}
function show(title,text){pendingAuth=null;$('authPanel').replaceChildren();$('modalDone').textContent='OK';$('modalTitle').textContent=title;$('modalText').textContent=text;$('modal').showModal()}
function render(){document.documentElement.lang=lang;$('banner').textContent=t('PROTOTYPE INTERACTIF · Données fictives · Aucun paiement, réservation ou service réel','INTERACTIVE PROTOTYPE · Sample data · No real payments, bookings or service');$('language').textContent=lang==='fr'?'EN':'FR';$('foot1').textContent=t('Québec d’abord. Syrie dans une version distincte, après validation.','Quebec first. Syria in a separate version after review.');$('foot2').textContent=t('Prévisualisation locale · Aucune donnée sauvegardée ni transmise','Local preview · No saved or transmitted data');const nav=[['stay','Séjours','Stays'],['wallet','Portefeuille','Wallet'],['provider','Hôtes','Hosts'],['admin','Administration','Admin']];$('nav').innerHTML=nav.map(([key,fr,en])=>`<button data-page="${key}" class="${page===key?'active':''}" ${page===key?'aria-current="page"':''}>${t(fr,en)}</button>`).join('');$('nav').insertAdjacentHTML('beforeend',`<button id="resetDemo">${t('Réinitialiser','Reset demo')}</button>`);$('resetDemo').onclick=()=>{for(const role of Object.keys(demoSessions))demoSessions[role]=false;pendingAuth=null;if($('modal').open)$('modal').close();render()};document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});if(page==='stay')stay();if(page==='wallet')wallet();if(page==='provider')providers();if(page==='admin')admin();if((page==='provider'&&demoSessions[provider])||(page==='admin'&&demoSessions.admin)){const out=document.createElement('button');out.className='secondary';out.id='accountSignout';out.textContent=t('Se déconnecter','Sign out');out.onclick=()=>{demoSessions[page==='admin'?'admin':provider]=false;render()};$('main').prepend(out)}window.dispatchEvent(new CustomEvent('qtr:render'))}
function requestGuest(after){
 show(t('Continuer sans compte','Continue as a guest'),t('Démonstration uniquement : code courriel fictif, aucun message envoyé. Sans inscription ni mot de passe.','Demo only: sample email code, no message sent. No signup or password.'));
 $('authPanel').innerHTML=`<div class="form"><label>${t('Courriel fictif','Sample email')}<input readonly type="email" value="guest@example.invalid"></label><label>${t('Code courriel fictif','Sample email code')}<input readonly inputmode="numeric" value="000000"></label></div>`;
 $('modalDone').textContent=t('Simuler la vérification du courriel','Simulate email verification');
 pendingAuth={role:'customer',after};
}
function requestAccount(role,after){
 if(role==='customer'){requestGuest(after);return;}

 show(t('Créer un compte ou se connecter','Create account or sign in'),t('Prototype uniquement. N’entrez aucun identifiant réel. Le service réel exigera une session vérifiée.','Prototype only. Do not enter real credentials. The live service will require a verified session.'));
 pendingAuth={role,after};
 pendingAuth.capsule=window.renderAccountCapsule({container:$('authPanel'),role,language:lang,action:$('modalDone')});
}
function providerEntrance(){
 $('main').innerHTML=`<div class="sectionhead"><span class="eyebrow">${t('ESPACE PRESTATAIRES','PROVIDER WORKSPACE')}</span><h1>${provider==='driver'?t('Créer votre espace<br>chauffeur.','Create your<br>driver account.'):t('Créer votre espace<br>hôte.','Create your<br>host account.')}</h1><p>${t('Créez un compte ou connectez-vous avant de consulter votre dossier. La qualification reste une étape distincte.','Create an account or sign in before accessing your file. Qualification remains a separate step.')}</p><div class="tabs"><button id="hostTab">${t('Hôte','Host')}</button></div></div><section class="card"><div class="row"><button class="primary" id="providerSignup">${t('Créer un compte','Create account')}</button><button class="secondary" id="providerSignin">${t('Se connecter','Sign in')}</button></div><div class="notice">${t('Connexion fictive uniquement. Les vrais documents et permis ne sont pas traités ici.','Sample sign-in only. Real documents and permits are not processed here.')}</div></section>`;
 $('hostTab').onclick=()=>{provider='host';providers()};
 $('providerSignin').onclick=()=>requestAccount(provider,render);
 $('providerSignup').onclick=()=>{requestAccount(provider,render);$('createTab').click()};
}
function stay(){$('main').innerHTML=`<div class="sectionhead"><span class="eyebrow">QTR · QUÉBEC</span><h1>${t('Un séjour.<br>Un accueil local.','A stay.<br>A local welcome.')}</h1><p>${t('Des logements avec une disponibilité claire et un dossier vérifié avant publication.','Places with clear availability and reviewed documentation before publication.')}</p></div><div class="grid"><section class="card"><form class="form" id="stayForm"><label>${t('Destination','Destination')}<input id="stayDestination" value="Montréal" required></label><div class="row"><label>${t('Arrivée','Check-in')}<input id="stayCheckIn" type="date" value="2026-11-12" required></label><label>${t('Départ','Check-out')}<input id="stayCheckOut" type="date" value="2026-11-14" required></label></div><label>${t('Voyageurs','Guests')}<select><option>2</option><option>1</option><option>3</option></select></label><button class="primary">${t('Prévisualiser le séjour','Preview stay')}</button></form><div class="notice">${t('Les autorisations municipales, l’assurance et l’enregistrement doivent être vérifiés pour les vrais logements.','Municipal permissions, insurance and registration must be verified for real properties.')}</div></section><article class="card"><div id="qtrGoogleMap"><p class="small">${t("Carte Google intégrée : configuration requise.","In-app Google map: configuration required.")}</p></div>${building}<h2>${t('Appartement du Plateau','Plateau apartment')}</h2><p>${t('Logement fictif · 2 voyageurs · 1 chambre','Sample property · 2 guests · 1 bedroom')}</p><span class="pill">${t('Dossier de démonstration','Demonstration file')}</span><div class="fare"><span>${t('Prix illustratif par nuit','Illustrative nightly price')}</span><b>${t('Devis CAD indisponible','CAD quote unavailable')}</b></div><p class="small">${t('Aucun numéro d’enregistrement valide n’est associé à ce logement fictif. Aucune disponibilité réelle.','No valid registration number is associated with this fictional property. No real availability.')}</p></article></div>`;$('stayCheckIn').oninput=()=>$('stayCheckOut').setCustomValidity('');$('stayCheckOut').oninput=()=>$('stayCheckOut').setCustomValidity('');$('stayForm').onsubmit=e=>{e.preventDefault();if($('stayCheckOut').value<=$('stayCheckIn').value){$('stayCheckOut').setCustomValidity(t('Le départ doit suivre l’arrivée.','Check-out must follow check-in.'));$('stayCheckOut').reportValidity();return;}if(!demoSessions.customer){requestAccount('customer',()=>show(t('Paiement simulé','Simulated payment'),t('Profil fictif uniquement. Aucune réservation ni paiement réel.','Sample profile only. No real booking or payment.')));return;}show(t('Séjour simulé','Simulated stay'),t('Aucune réservation n’est créée. Le parcours réel inclura le total détaillé, le numéro d’enregistrement vérifié et les règles de remboursement avant paiement.','No reservation is created. The live flow will show an itemized total, verified registration number and refund terms before payment.'))}}
function wallet(){$('main').innerHTML=`<div class="sectionhead"><span class="eyebrow">${t('PORTEFEUILLE · SIMULATION','WALLET · SIMULATION')}</span><h1>${t('Votre solde,<br>en toute clarté.','Your balance,<br>clearly presented.')}</h1><p>${t('Prix et paiements en CAD. Récompenses séparées et référence USD optionnelle.','CAD prices and payments. Separate rewards and an optional USD reference.')}</p></div><div class="grid"><section class="card"><span class="eyebrow">${t('SOLDE ACHETÉ FICTIF','SAMPLE PURCHASED BALANCE')}</span><div class="walletAmount">100,00 CAD</div><p>${t('Solde fictif CAD, distinct de la référence MSH en USD. Aucune conversion automatique.','Sample CAD balance, separate from the USD MSH reference. No automatic conversion.')}</p><div class="row"><button class="primary" data-wallet="topup">${t('Recharger','Top up')}</button><button class="secondary" data-wallet="send">${t('Transférer','Transfer')}</button><button class="secondary" data-wallet="withdraw">${t('Retirer','Withdraw')}</button></div><div class="notice">${t('Toutes les opérations sont fictives. Les dépôts, transferts et retraits réels nécessitent un partenaire et une validation distincte.','All actions are simulated. Real deposits, transfers and withdrawals require a partner and a separate review.')}</div></section><section class="card"><h2>${t('Soldes séparés','Separate balances')}</h2><div class="fare"><span>CAD · ${t('proposition locale','local proposal')}</span><b>— USD</b></div><div class="fare"><span>${t('Récompenses fictives','Sample rewards')}</span><b>12 ${t('points','points')}</b></div><p>${t('Aucune conversion USD/CAD implicite. Le taux et les frais seront confirmés avant toute conversion.','No implicit USD/CAD conversion. Rates and fees will be confirmed before any conversion.')}</p><h2>${t('Historique fictif','Sample history')}</h2><table class="table"><tbody><tr><td>${t('Recharge de démonstration','Demonstration top-up')}</td><td>+100 CAD</td></tr><tr><td>${t('Aucun transfert réel','No real transfer')}</td><td>—</td></tr></tbody></table></section></div>`;document.querySelectorAll('[data-wallet]').forEach(b=>b.onclick=()=>{if(!demoSessions.customer){requestAccount('customer',()=>wallet());return;}show(t('Opération simulée','Simulated operation'),t('Cette prévisualisation ne demande pas de coordonnées bancaires, ne contacte aucun ami et ne déplace aucun fonds.','This preview does not request bank details, contact friends or move funds.'))})}
function providers(){if(!demoSessions[provider]){providerEntrance();return;}$('main').innerHTML=`<div class="sectionhead"><span class="eyebrow">${t('ESPACE PRESTATAIRES','PROVIDER WORKSPACE')}</span><h1>${t('Prêt pour votre<br>prochaine activité.','Ready for your<br>next service.')}</h1><div class="tabs"><button id="hostTab" class="${provider==='host'?'active':''}">${t('Hôte','Host')}</button></div></div><div class="grid"><section class="card"><h2>${provider==='driver'?t('Dossier chauffeur fictif','Sample driver file'):t('Dossier logement fictif','Sample property file')}</h2><table class="table"><tbody>${(provider==='driver'?[t('Permis et qualification','Licence and qualification'),t('Formation et examen','Training and test'),t('Assurance et inspection','Insurance and inspection'),t('Inspection avant le service','Pre-shift inspection')]:[t('Enregistrement touristique','Tourist registration'),t('Conformité municipale','Municipal conformity'),t('Assurance du logement','Property insurance'),t('Autorisation du propriétaire','Owner permission')]).map(x=>`<tr><td>${x}</td><td><span class="status">${t('Exemple seulement','Sample only')}</span></td></tr>`).join('')}</tbody></table><p class="small">${t('Aucun document réel téléversé ou approuvé.','No real documents uploaded or approved.')}</p><button class="primary" id="providerAction">${t('Voir le parcours de validation','View review flow')}</button></section><section class="card"><h2>${t('Vos revenus, détaillés','Your earnings, itemized')}</h2><p>${t('Le parcours prévu distingue prix, commission, taxes, pourboires, remboursements et versement net.','The planned flow separates price, commission, taxes, tips, refunds and net payout.')}</p><div class="fare"><span>${t('Commission retenue dans le projet','Commission retained in the plan')}</span><b>15%</b></div><div class="notice">${t('La base de calcul et le traitement fiscal québécois doivent être validés. Ce chiffre n’est pas une estimation de revenu.','The calculation base and Quebec tax treatment require review. This figure is not an earnings estimate.')}</div></section></div>`;$('hostTab').onclick=()=>{provider='host';providers()};$('providerAction').onclick=()=>show(t('Validation humaine','Human review'),t('Dans l’application réelle, les documents seront vérifiés et les expirations bloqueront les activités. Cette démonstration n’accorde aucune permission.','In the live app, documents will be reviewed and expirations will block service. This demo grants no permissions.'))}
function adminEntrance(){
 $('main').innerHTML=`<section class="card"><span class="eyebrow">${t('ACCÈS ADMINISTRATION','ADMIN ACCESS')}</span><h1>${t('Votre espace administrateur','Your admin workspace')}</h1><p>${t('Créer une demande de compte ou se connecter avec un profil fictif approuvé.','Create an account application or sign in with an approved sample profile.')}</p><div class="row"><button class="primary" id="adminSignup">${t('Créer un compte','Create account')}</button><button class="secondary" id="adminSignin">${t('Se connecter','Sign in')}</button></div><p class="notice">${t('Démonstration uniquement. Les demandes nécessitent une invitation et une approbation.','Demonstration only. Applications require invitation and approval.')}</p></section>`;
 $('adminSignin').onclick=()=>requestAccount('admin',render);
 $('adminSignup').onclick=()=>{requestAccount('admin',render);$('createTab').click()};
}
function admin(){if(!demoSessions.admin){adminEntrance();return;}$('main').innerHTML=`<div class="sectionhead"><span class="eyebrow">${t('ADMINISTRATION · DÉMONSTRATION','ADMIN · DEMONSTRATION')}</span><h1>${t('Une équipe.<br>Une vue claire.','One team.<br>A clear view.')}</h1><p>${t('La véritable administration exige une connexion. Cette page illustre son organisation sans exposer de données réelles.','The real admin requires sign-in. This page illustrates its organization without exposing real data.')}</p></div><div class="tiles">${tile(t('Prestataires à vérifier','Providers to review'),t('Identité, qualifications, assurances et logements.','Identity, qualifications, insurance and properties.'))}${tile(t('Opérations et sécurité','Operations and safety'),t('Séjours, demandes et incidents.','Stays, requests and incidents.'))}${tile(t('Finance et rapprochement','Finance and reconciliation'),t('Soldes, paiements, remboursements et exceptions.','Balances, payments, refunds and exceptions.'))}</div><section class="card" style="margin-top:24px"><span class="pill">${t('Ressources humaines','Human Resources')}</span><h2>${t('Préparer un plan d’accueil','Prepare an onboarding plan')}</h2><p>${t('L’espace RH réel est développé dans V6, avec IA désactivée par défaut. Ici, le bouton affiche un exemple local, sans appel IA.','The real HR workspace is built in V6, with AI disabled by default. Here the button displays a local sample, with no AI request.')}</p><button class="primary" id="draftButton">${t('Voir un exemple de brouillon','View a sample draft')}</button><div id="result"></div></section>`;$('draftButton').onclick=()=>{const pre=document.createElement('pre');pre.className='draft';pre.textContent=t('BROUILLON — VALIDATION HUMAINE REQUISE\n\nPoste : Coordination du soutien\n\nJour 1 : accueil, accès limités et confidentialité.\nSemaine 1 : formation aux demandes clients et aux incidents.\nSemaine 2 : exercices supervisés et vérification des acquis.\n\nExemple fictif. Aucun dossier employé ni décision d’emploi.','DRAFT — HUMAN REVIEW REQUIRED\n\nRole: Support coordination\n\nDay 1: welcome, limited access and privacy.\nWeek 1: training on customer requests and incidents.\nWeek 2: supervised exercises and learning review.\n\nSample only. No employee records or employment decisions.');$('result').replaceChildren(pre)}}
$('language').onclick=()=>{lang=lang==='fr'?'en':'fr';render()};$('close').onclick=()=>$('modal').close();$('modalDone').onclick=()=>{const request=pendingAuth;const approval=request?.capsule?.requiresApproval();pendingAuth=null;$('modal').close();if(approval){show(t('Demande en attente — démonstration','Application pending — demonstration'),t('Demande fictive préparée. Aucun compte enregistré ni accès accordé. Une approbation humaine sera requise.','Sample application prepared. No account saved or access granted. Human approval will be required.'));return;}if(request){demoSessions[request.role]=true;request.after()}};render();
</script><script type="module" src="./maps.mjs"></script></body></html>
